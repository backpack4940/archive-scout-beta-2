          grep -qxF '*.egg-info/' .gitignore || printf '\n*.egg-info/\n' >> .gitignore

      - name: Verify launch fix
        run: |
          python - <<'PY'
          from archive_scout.constants import VERSION
          from archive_scout.ui import main_window
          from archive_scout.ui.event_queue import CoalescingEventQueue
          assert VERSION == "3.0.0-beta.2.1"
          assert main_window.CoalescingEventQueue is CoalescingEventQueue
          print("Beta 2.1 launch regression fixed")
          PY

      - name: Run complete test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run offline benchmark smoke test
        run: python scripts/benchmark_offline.py --cdx-rows 1000 --result-rows 100 --body-bytes 1024

      - name: Remove generated files
        shell: bash
        run: |
          rm -rf build dist release archive_scout.egg-info
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.py[co]' -delete

      - name: Commit only Beta 2.1 source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .gitignore \
            CHANGELOG.md \
            README.md \
            RELEASE_NOTES.md \
            archive_scout/constants.py \
            archive_scout/ui/main_window.py \
            run_app.py \
            scripts/build_macos.sh \
            tests/unit/test_beta2_1_startup.py
          git diff --cached --check
          git commit -m "Release Beta 2.1 macOS launch fix"
          git push origin main

      - name: Start cross-platform tests and builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run tests.yml --ref main
          gh workflow run build-and-release.yml --ref main
