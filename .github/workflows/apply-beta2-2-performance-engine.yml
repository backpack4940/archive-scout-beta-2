          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "archive-scout-beta22.zip"
          root = Path.cwd().resolve()
          with zipfile.ZipFile(archive) as payload:
              for member in payload.infolist():
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe payload path: {member.filename}")
                  if path.parts and path.parts[0] == ".github":
                      raise SystemExit(f"Payload may not modify workflows: {member.filename}")
              payload.extractall(root)
          PY

      - name: Remove generated build products
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist .pytest_cache .mypy_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +

      - name: Verify protected workflows are unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/workflows.before"

      - name: Install package and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Compile and verify release identity
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q archive_scout tests scripts
          python - <<'PY'
          from archive_scout.constants import SCHEMA_VERSION, VERSION
          assert VERSION == "3.0.0-beta.2.2", VERSION
          assert SCHEMA_VERSION == 5, SCHEMA_VERSION
          print("Archive Scout Beta 2.2 identity verified")
          PY

      - name: Run complete regression suite
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/beta22-tests.txt"
          grep -Eq '^Ran 134 tests' "$RUNNER_TEMP/beta22-tests.txt"
          grep -Eq '^OK( \(skipped=1\))?$' "$RUNNER_TEMP/beta22-tests.txt"

      - name: Run offline 100,000-row performance validation
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          python scripts/benchmark_offline.py             --cdx-rows 100000             --cdx-chunk-rows 50000             --result-rows 10000             --body-bytes 8192             --keyword-patterns 5000             --keyword-searches 1000             --keyword-score-runs 100             --output "$RUNNER_TEMP/beta22-benchmark.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "beta22-benchmark.json").read_text())
          assert report["cdx_rows_inserted"] == 100000, report
          assert report["unchanged_cdx_writes"] == 0, report
          assert report["http_attempts"] == 0, report
          assert report["duplicate_work"] == 0, report
          names = {entry["name"] for entry in report["metrics"]}
          assert {"literal_prefilter", "literal_scoring", "repeat_parse_and_noop_upsert"} <= names, names
          print("Beta 2.2 offline performance validation passed")
          PY

      - name: Clean generated products after validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist .pytest_cache .mypy_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          sha256sum -c "$RUNNER_TEMP/workflows.before"

      - name: Stage only the approved Beta 2.2 files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            git add -- "$path"
          done <<'FILES'
          .gitignore
          CHANGELOG.md
          README.md
          RELEASE_NOTES.md
          REPOSITORY_DETAILS.md
          SOURCE_VALIDATION.txt
          UPLOAD_CHECKLIST.txt
          archive_scout/cdx/client.py
          archive_scout/constants.py
          archive_scout/database/repositories.py
          archive_scout/database/schema.py
          archive_scout/downloads/downloader.py
          archive_scout/downloads/retry.py
          archive_scout/json_codec.py
          archive_scout/media/downloader.py
          archive_scout/network/transports.py
          archive_scout/operations.py
          archive_scout/scanning/automaton.py
          archive_scout/scanning/keywords.py
          archive_scout/scanning/rescanner.py
          archive_scout/scanning/scoring.py
          docs/BENCHMARKS.md
          docs/BETA2_2_PERFORMANCE_ENGINE.md
          packaging/windows/version_info.txt
          scripts/benchmark_offline.py
          tests/integration/test_alpha2_media.py
          tests/unit/test_beta2_1_startup.py
          tests/unit/test_beta2_2_performance_engine.py
          tests/unit/test_retry.py
          FILES
          git diff --cached --check
          python - <<'PY'
          import subprocess
          allowed = set(['.gitignore', 'CHANGELOG.md', 'README.md', 'RELEASE_NOTES.md', 'REPOSITORY_DETAILS.md', 'SOURCE_VALIDATION.txt', 'UPLOAD_CHECKLIST.txt', 'archive_scout/cdx/client.py', 'archive_scout/constants.py', 'archive_scout/database/repositories.py', 'archive_scout/database/schema.py', 'archive_scout/downloads/downloader.py', 'archive_scout/downloads/retry.py', 'archive_scout/json_codec.py', 'archive_scout/media/downloader.py', 'archive_scout/network/transports.py', 'archive_scout/operations.py', 'archive_scout/scanning/automaton.py', 'archive_scout/scanning/keywords.py', 'archive_scout/scanning/rescanner.py', 'archive_scout/scanning/scoring.py', 'docs/BENCHMARKS.md', 'docs/BETA2_2_PERFORMANCE_ENGINE.md', 'packaging/windows/version_info.txt', 'scripts/benchmark_offline.py', 'tests/integration/test_alpha2_media.py', 'tests/unit/test_beta2_1_startup.py', 'tests/unit/test_beta2_2_performance_engine.py', 'tests/unit/test_retry.py'])
          staged = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          unexpected = staged - allowed
          if unexpected:
              raise SystemExit(f"Unexpected staged files: {sorted(unexpected)}")
          if any(path.startswith(".github/workflows/") for path in staged):
              raise SystemExit("A protected workflow was staged")
          print(f"Approved staged files: {len(staged)}")
          PY

      - name: Commit Beta 2.2
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Beta 2.2 is already applied; no commit is necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release Beta 2.2 performance engine"
          git push origin HEAD:main
