name: Apply Beta 2.2 Performance Engine

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-beta2-2-performance-engine
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt

      - name: Record protected workflow hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/workflows/tests.yml .github/workflows/build-and-release.yml > "$RUNNER_TEMP/workflows.before"

