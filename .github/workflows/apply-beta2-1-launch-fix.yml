      - name: Install patched package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Compile patched source
        run: python -m compileall -q archive_scout tests scripts/benchmark_offline.py

      - name: Verify Beta 2.1 startup symbols and metadata
        run: |
          python - <<'PY'
          import importlib.metadata
          from archive_scout.constants import VERSION
          from archive_scout.ui import main_window
          from archive_scout.ui.event_queue import CoalescingEventQueue

          assert VERSION == "3.0.0-beta.2.1"
          assert importlib.metadata.version("archive-scout") == "3.0.0b2.post1"
          assert main_window.CoalescingEventQueue is CoalescingEventQueue
          print("Beta 2.1 startup regression fixed")
          PY

      - name: Run complete test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run offline benchmark smoke test
        run: python scripts/benchmark_offline.py --cdx-rows 1000 --result-rows 100 --body-bytes 1024

      - name: Commit Beta 2.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-beta2-1-launch-fix.yml
          git add -A
          git commit -m "Release Beta 2.1 macOS launch fix"
          git push origin main

      - name: Start cross-platform tests and builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run tests.yml --ref main
          gh workflow run build-and-release.yml --ref main
