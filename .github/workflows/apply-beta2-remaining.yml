          python scripts/benchmark_offline.py --cdx-rows 1000 --result-rows 100 --body-bytes 1024

      - name: Commit implementation and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-beta2-remaining.yml
          git rm -f .github/workflows/apply-merge-fix.yml || true
          git add CHANGELOG.md README.md RELEASE_NOTES.md REPOSITORY_DETAILS.md ROADMAP.md archive_scout docs
          git commit -m "Apply remaining Beta 2 hardening implementation"
          git push

      - name: Start the complete cross-platform test matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run tests.yml --ref main
          gh issue close 1 --comment "Temporary patch trigger completed." || true
          gh issue close 2 --comment "Temporary patch trigger completed." || true
